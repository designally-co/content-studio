# Pokes Content Studio's autopilot endpoint on a timer.
#
# Vercel's own cron on the Hobby plan fires roughly once a day, and one article
# takes seven steps — that schedule would need over a week to finish one. This
# runs every five minutes instead (GitHub's shortest schedule), costs nothing on
# a public repository, and works whatever plan the project is on.
#
# FIVE MINUTES BECAUSE A POKE DOES ONE STEP. A request is killed at sixty
# seconds and a draft can take fifty, so the runner will not begin a second step
# unless a slow one would still fit — which it rarely does. Seven steps at five
# minutes puts an article about half an hour after the first poke.
#
# The endpoint is idempotent: a poke with nothing to do returns `idle` and costs
# a single database query, so a tight schedule is cheap.
#
# Two repository secrets are required, under Settings → Secrets and variables →
# Actions:
#   AUTOPILOT_URL      https://<your-app>/api/cron/autopilot
#   AUTOPILOT_SECRET   the same value as CRON_SECRET in the Vercel environment
#
# Without them the job exits without calling anything, rather than failing loudly
# every ten minutes on a repository that has not opted in.
name: Autopilot

on:
  schedule:
    - cron: "*/5 * * * *"
  # So it can be tried once by hand before trusting it to a schedule.
  workflow_dispatch:

# One at a time. A poke that overlaps the previous one is wasted work — the
# runner's own database claim would refuse it anyway.
concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  poke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Advance the autopilot
        env:
          URL: ${{ secrets.AUTOPILOT_URL }}
          SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "AUTOPILOT_URL or AUTOPILOT_SECRET is not set — nothing to poke."
            exit 0
          fi
          # --fail-with-body so a 4xx/5xx fails the job AND prints why.
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$URL" \
            -H "authorization: Bearer $SECRET" \
            -H "content-type: application/json"
