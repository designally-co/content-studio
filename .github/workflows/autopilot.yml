# Pokes Content Studio's autopilot endpoint, and stays with a run until it ends.
#
# WHY NOT `*/5` AND ONE POKE. That is what this used to be, and GitHub does not
# honour it: measured over two days, a `*/5` schedule was delivered every two to
# five HOURS. One article takes seven steps and a poke advances about one, so an
# article was taking roughly a day rather than the half hour the schedule
# implied. GitHub throttles frequent schedules on shared runners and drops most
# of the fires; a short cron is a wish, not a guarantee.
#
# SO THE JOB BRINGS ITS OWN CLOCK. It pokes, and if the endpoint says anything
# is in flight it keeps poking every five minutes until the work is done. The
# runner's timer is reliable in a way the scheduler is not.
#
# AND IT LEAVES IMMEDIATELY WHEN THERE IS NOTHING TO DO. `idle` on the first
# poke means no routine was due, and the job exits in seconds having spent one
# database query. That matters: routines run about once a week, so almost every
# fire is a no-op, and a job that looped regardless would hold a free runner for
# nothing around the clock. The loop is the exception, not the schedule.
#
# Worst case is therefore: up to half an hour before a due routine is noticed,
# then about thirty-five minutes to finish the article.
#
# Two repository secrets are required, under Settings → Secrets and variables →
# Actions:
#   AUTOPILOT_URL      https://<your-app>/api/cron/autopilot
#   AUTOPILOT_SECRET   the same value as CRON_SECRET in the Vercel environment
#
# Without them the job exits without calling anything. NOTE THAT THIS STILL
# SHOWS AS A GREEN TICK — a passing run does not prove the secrets are set, and
# the only way to tell is to read the log. It says which case it took.
name: Autopilot

on:
  schedule:
    # Twice an hour. Frequent enough that a due routine waits half an hour at
    # worst, infrequent enough that GitHub actually delivers it.
    - cron: "0,30 * * * *"
  # So it can be tried once by hand before trusting it to a schedule.
  workflow_dispatch:

# One at a time, and a new fire replaces a stale loop rather than queueing
# behind it — two jobs poking the same endpoint is wasted work, and the runner's
# own database claim would refuse the second anyway.
concurrency:
  group: autopilot
  cancel-in-progress: true

jobs:
  poke:
    runs-on: ubuntu-latest
    # Enough for seven steps at five minutes with room to spare, and a ceiling
    # so a bug cannot hold a runner indefinitely.
    timeout-minutes: 75
    steps:
      - name: Advance the autopilot until it is idle
        env:
          URL: ${{ secrets.AUTOPILOT_URL }}
          SECRET: ${{ secrets.AUTOPILOT_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "AUTOPILOT_URL or AUTOPILOT_SECRET is not set — nothing to poke."
            exit 0
          fi

          # Twelve pokes at five minutes covers seven steps and then some.
          for attempt in $(seq 1 12); do
            # No --fail-with-body here: a transient 500 on step three should not
            # abandon an article that is half written. The status is inspected
            # instead, and only a run of failures ends the job.
            body=$(curl --silent --show-error --max-time 120 \
              --write-out '\n%{http_code}' \
              -X POST "$URL" \
              -H "authorization: Bearer $SECRET" \
              -H "content-type: application/json" || true)

            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            echo "poke $attempt → HTTP ${code:-none} ${payload}"

            if [ "$code" != "200" ]; then
              failures=$((${failures:-0} + 1))
              if [ "${failures}" -ge 3 ]; then
                echo "Three pokes in a row failed. Giving up so the failure is visible."
                exit 1
              fi
            else
              failures=0
              # `idle` means nothing is in flight and nothing was due. On the
              # first poke that is a quiet no-op; later it means the article
              # this job started has finished.
              case "$payload" in
                *'"idle":true'*)
                  if [ "$attempt" -eq 1 ]; then
                    echo "Nothing was due. Exiting."
                  else
                    echo "Work finished after $attempt pokes."
                  fi
                  exit 0
                  ;;
              esac
            fi

            sleep 300
          done

          echo "Still busy after twelve pokes; the next scheduled run will carry on."
