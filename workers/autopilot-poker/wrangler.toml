# The autopilot's clock.
#
# WHY THIS EXISTS AT ALL. One poke of /api/cron/autopilot advances a run by
# exactly one step — the runner keeps its own budget under Vercel's 60s function
# cap and stops cleanly rather than being cut off mid-step — so an article needs
# five to seven pokes. Something has to make that request on a timer.
#
# WHY NOT GITHUB ACTIONS, WHICH THIS REPLACES. It shipped a workflow set to
# `0,30 * * * *`. Measured over two days in September 2026, GitHub delivered it
# every TWO TO FOUR HOURS: 00:27, 08:59, 13:29, 17:25, 20:06, 22:53, 01:04 UTC.
# GitHub throttles frequent schedules on shared runners and drops most fires, so
# a routine due at 09:00 sat until the next delivery happened to land on it —
# hours later, or whenever somebody opened the app, since an open tab steps a
# run too. A short cron there is a wish, not a guarantee.
#
# WHY CLOUDFLARE. The bearer token below can spend Anthropic and Fal credit and
# publish to a live site. On a third-party cron service that credential lives
# with another vendor; here it is an encrypted secret in an account this team
# already owns. Cron Triggers also actually fire on the interval they are given.
name = "autopilot-poker"
main = "src/index.ts"
compatibility_date = "2026-09-09"

# NO PUBLIC URL. This Worker only ever runs on the schedule below — it serves no
# HTTP routes, so it needs no hostname. Left at the default, wrangler asks to
# register a *.workers.dev subdomain for the whole account on first deploy,
# which is a shared, permanent thing to create for something that would never
# answer a request.
workers_dev = false

# Every two minutes. THE INTERVAL IS THE ARTICLE'S PACE, because a poke advances
# one step and the step itself takes a fraction of the gap: measured end to end
# on 9 September 2026, a seven-step article took 25 minutes at */5 while the work
# inside it was well under five. At */2 the same article lands in about 12.
#
# Cheap to run constantly: a poke with nothing to do costs one database query and
# returns `idle`. 720 requests a day against a free tier of 100,000 — and Vercel
# only bills the function for the milliseconds it spends saying "nothing is due".
#
# Not faster than this. Two minutes is already shorter than the slowest step, so
# some pokes will find the run claimed and do nothing; below that the misses
# outnumber the work without the article arriving any sooner.
[triggers]
crons = ["*/2 * * * *"]
