# Designally Content Studio — container deployment.
# `next start` in a container is a supported path (the app will later move
# off Vercel to a self-hosted server). Configure via .env.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Postgres connection. For Supabase use the pooled connection string.
      # Leave empty to fall back to embedded PGlite in ./data (dev/demo only).
      - DATABASE_URL=${DATABASE_URL:-}
      # Session signing secret — REQUIRED in production. Generate with:
      #   openssl rand -hex 32
      - AUTH_SECRET=${AUTH_SECRET:-}
      # Anthropic text generation (server-side only).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Image providers (optional; enable per provider).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # Cloudflare R2 for images (optional here; local disk otherwise).
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
    volumes:
      # Persists PGlite data + local image storage across restarts when R2
      # is not configured. Safe to keep even when DATABASE_URL is set.
      - content_studio_data:/app/data
    restart: unless-stopped

volumes:
  content_studio_data:
